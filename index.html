<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Kenda</title>
  <meta name="description" content="Le suivi des boires de bébé, partagé entre parents.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FBF6EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kenda">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-192.png" type="image/png">

  <!-- Polices (gardées en cache par sw.js ; repli sur les polices du système hors ligne) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">

  <!-- Version DEV : toute adresse autre que celle de production (la branche dev
       sur Cloudflare, dev-kenda…) prend un nom et une icône à part (bandeau
       « DEV »), pour ne pas la confondre avec la vraie app sur l'iPhone. -->
  <script>
    (function () {
      var PROD_HOSTS = ["kenda.jamberlouze.workers.dev"];
      if (PROD_HOSTS.indexOf(location.hostname) >= 0) return;
      window.KENDA_DEV = true;
      document.title = "Kenda DEV";
      var set = function (sel, attr, v) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, v); };
      set('link[rel="manifest"]', "href", "manifest-dev.webmanifest");
      set('link[rel="apple-touch-icon"]', "href", "assets/icon-dev-180.png");
      set('link[rel="icon"]', "href", "assets/icon-dev-192.png");
      set('meta[name="apple-mobile-web-app-title"]', "content", "Kenda DEV");
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="loading-screen"><div class="spinner"></div></div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
